    <div class="main">
      <div class="top">
        <div>
          <div class="title">Runtime 注册</div>
          <div class="meta">含 embed_url</div>
        </div>
        <div class="meta">dept_id=100 · 一级部门=公司</div>
      </div>
      <div class="content">

        <div class="banner">登记 Hermes 时除 Base URL / health 外，增加 embed_url（对话 iframe 地址）或其它嵌入方式说明。</div>
        <div class="card row">
          <div class="col">
            <label>名称</label>
            <input value="hermes-local" />
            <div style="height:8px"></div>
            <label>Base URL / API</label>
            <input value="http://127.0.0.1:9119" />
            <div style="height:8px"></div>
            <label>对话嵌入 embed_url</label>
            <input value="http://127.0.0.1:9119/embed/chat" />
            <div style="height:8px"></div>
            <label>健康检查</label>
            <input value="/health" />
            <div class="toolbar">
              <button class="btn primary">保存并启用</button>
              <button class="btn">测连通</button>
            </div>
          </div>
          <div class="col">
            <label>状态</label>
            <div><span class="pill ok">healthy</span></div>
            <p class="muted" style="margin-top:12px">平台不自研 Agent 对话页；只保存连接与嵌入配置，通过 Adapter / iframe 接入。</p>
          </div>
        </div>
